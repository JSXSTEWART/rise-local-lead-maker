# Ollama Container Stack - Lightweight LLM Inference
# Supports both CPU and GPU, ideal for smaller models

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ${TENANT_ID}-ollama
    restart: unless-stopped
    ports:
      - "${API_PORT:-11434}:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /root/.ollama/models
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-all}
    volumes:
      - ollama-data:/root/.ollama
    labels:
      # Traefik routing
      - "traefik.enable=true"
      - "traefik.http.routers.${TENANT_ID}.rule=Host(`${SUBDOMAIN}`)"
      - "traefik.http.routers.${TENANT_ID}.entrypoints=websecure"
      - "traefik.http.routers.${TENANT_ID}.tls.certresolver=letsencrypt"
      - "traefik.http.services.${TENANT_ID}.loadbalancer.server.port=11434"
      
      # Rate limiting
      - "traefik.http.middlewares.${TENANT_ID}-ratelimit.ratelimit.average=${RATE_LIMIT:-100}"
      - "traefik.http.routers.${TENANT_ID}.middlewares=${TENANT_ID}-ratelimit"
    networks:
      - llm-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]
        limits:
          memory: ${MEMORY_LIMIT:-16g}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Model puller - pulls model on first start
  ollama-init:
    image: ollama/ollama:latest
    container_name: ${TENANT_ID}-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama-data:/root/.ollama
    entrypoint: /bin/bash
    command:
      - -c
      - |
        echo "Pulling model: ${MODEL:-llama3:8b}"
        ollama pull ${MODEL:-llama3:8b}
        echo "Model ready"
    networks:
      - llm-network
    restart: "no"

networks:
  llm-network:
    external: true

volumes:
  ollama-data:
    driver: local
